[package]
name = "spooky-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "spooky"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
spooky-core.workspace = true
gpui = { workspace = true }
gpui_platform = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
raw-window-handle = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1"
smallvec = "1"
fontdb = "0.23"
ttf-parser = "0.25"
fontdue = "0.9"
global-hotkey = "0.6"
rfd = "0.15"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { version = "1", features = ["sync", "process", "time", "io-util", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAccessibility", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageView", "NSResponder", "NSScreen", "NSTextInputContext", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry"] }

[lints]
workspace = true
