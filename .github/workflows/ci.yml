name: CI

# Built for a quick answer on a pull request: every check is its own job, so they run
# side by side and the slowest one sets the time; builds are cached from main; a pull
# request is built once (only main is built on push); and the packaging jobs, which are
# the slowest, run on main and on pull requests that touch what packaging uses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster builds and smaller caches; the failures CI exists to find do not need either.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  format:
    name: Formatting and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libfontconfig-dev libfreetype-dev libxcb1-dev pkg-config clang cmake
      - name: Activate repository toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libfontconfig-dev libfreetype-dev libxcb1-dev pkg-config clang cmake
      - name: Activate repository toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libfontconfig-dev libfreetype-dev libxcb1-dev pkg-config clang cmake
      - name: Activate repository toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit and integration tests
        run: cargo test --locked --workspace --all-targets
      - name: Documentation tests
        run: cargo test --locked --workspace --doc

  web:
    name: Agent view
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/agent/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check and unit tests
        run: npm run check
      - name: Build
        run: npm run build
      - name: The embedded page is the built one
        run: git diff --exit-code -- dist/index.html

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libfontconfig-dev libfreetype-dev libxcb1-dev pkg-config clang cmake
      - name: Install declared minimum toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check minimum supported Rust version
        run: cargo +1.98.0 check --locked --workspace --all-targets

  # Whether a pull request changes anything packaging uses. Packaging is the slowest
  # job (a release build with LTO), so a pull request that does not touch it skips it;
  # main always runs it.
  changes:
    name: Packaging changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packaging: ${{ steps.files.outputs.packaging }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename' > files.txt
          if grep -qE '^(scripts/|packaging/|assets/|\.github/workflows/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$)' files.txt; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgtk-3-dev libfontconfig-dev libfreetype-dev libxcb1-dev pkg-config clang cmake desktop-file-utils appstream
      - name: Activate repository toolchain
        run: rustup show active-toolchain
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Package
        run: ./scripts/package.sh
      - name: Linux package metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/linux/dev.spooky.terminal.desktop
          appstreamcli validate --no-net packaging/linux/dev.spooky.terminal.metainfo.xml
          dpkg-deb --info dist/spooky_*.deb
      - name: Keep the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spooky-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
