[workspace]
members = ["crates/spooky-core", "crates/spooky-server", "crates/spooky-desktop"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev.1"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spooky-core = { path = "crates/spooky-core" }
# GPUI is Zed's UI framework. It is not published to crates.io after 0.2.2, so it is
# taken from a tag of the Zed repository. Pin a tag, never a branch, and review every
# bump: the API changes between releases. `font-kit` is required on macOS, where the
# text system draws nothing without it.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.9.0" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.9.0", default-features = false, features = ["font-kit", "wayland", "x11"] }

# Zed builds GPUI against forks of these crates, and a patch table in a dependency's own
# workspace does not apply to ours. Keep the revisions equal to Zed's for the pinned tag.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

# Zed's `ztracing` crate (and through it `zlog` and `ztracing_macro`) is GPL-3.0-or-later,
# and GPUI uses one attribute from it. A first-party no-op with the same name keeps the
# MIT workspace free of GPL code; see docs/architecture.md before changing it.
[patch."https://github.com/zed-industries/zed"]
ztracing = { path = "third_party/ztracing" }
